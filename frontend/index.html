<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>JARVIS</title>
  <meta name="description" content="Assistente personale multi-cervello" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#04050b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Schermata di login (ADR-0002: password singola) -->
    <section id="login-screen" class="screen">
      <div class="login-card">
        <div class="brand">
          <img src="icons/icon-192.png" alt="" class="brand-mark" />
          <h1>JARVIS</h1>
        </div>
        <p class="brand-tagline">Assistente personale multi-cervello</p>
        <form id="login-form" autocomplete="off">
          <label for="login-password" class="sr-only">Password</label>
          <input
            id="login-password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button type="submit" id="login-submit">
            <span class="btn-label">Accedi</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>
        <p id="login-error" class="login-error" role="alert" hidden></p>
      </div>
    </section>

    <!-- Interfaccia 3D -->
    <section id="chat-screen" class="screen jv-scene" hidden>

      <canvas id="scene-canvas"></canvas>
      <div class="jv-vignette"></div>
      <div id="body-labels" class="jv-labels"></div>

      <!-- Status bar -->
      <header class="jv-statusbar">
        <div class="jv-wordmark">
          <span class="jv-blinkdot"></span>
          <span class="jv-wordmark-text">JARVIS</span>
        </div>
        <div class="jv-brains" id="jv-brains"></div>
        <div class="jv-telemetry">
          <span id="jv-bodycount">00 BODIES</span>
          <span class="jv-sep">|</span>
          <span id="jv-statecode">IDLE</span>
        </div>
        <!-- Utility (non nel design originale: funzioni reali dell'app) -->
        <div class="jv-utility">
          <button id="projects-btn" class="jv-icon-btn" type="button" title="Progetti">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6Z"/></svg>
          </button>
          <button id="library-btn" class="jv-icon-btn" type="button" title="Libreria">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 4h4a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4V4Zm16 0h-4a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20V4Z"/></svg>
          </button>
          <button id="sites-btn" class="jv-icon-btn" type="button" title="Siti Web">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.94 9h-3.02a15.6 15.6 0 0 0-1.14-5.4A8.03 8.03 0 0 1 19.94 11ZM12 4.06c.82 1.1 1.8 3 2.1 6.94H9.9c.3-3.94 1.28-5.84 2.1-6.94ZM9.9 13h4.2c-.3 3.94-1.28 5.84-2.1 6.94-.82-1.1-1.8-3-2.1-6.94ZM8.22 5.6A15.6 15.6 0 0 0 7.08 11H4.06A8.03 8.03 0 0 1 8.22 5.6ZM4.06 13h3.02c.14 2.1.55 3.9 1.14 5.4A8.03 8.03 0 0 1 4.06 13Zm11.72 5.4c.59-1.5 1-3.3 1.14-5.4h3.02a8.03 8.03 0 0 1-4.16 5.4Z"/></svg>
          </button>
          <button id="tts-btn" class="jv-icon-btn active" type="button" title="Disattiva voce risposte">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.49 4.49 0 0 0 16.5 12ZM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77Z"/></svg>
          </button>
          <button id="google-btn" class="jv-icon-btn" type="button" title="Collega Google">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12s3.36-7.27 7.19-7.27c3.08 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.19 2C6.42 2 2.03 6.8 2.03 12s4.39 10 10.16 10c5.05 0 9.81-3.55 9.81-10.36 0-.78-.15-1.54-.15-1.54Z"/></svg>
          </button>
          <button id="logout-btn" class="jv-icon-btn" type="button" title="Esci">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 17v-2H4V9h6V7l5 5-5 5Zm-6 3q-.825 0-1.412-.587Q2 18.825 2 18V6q0-.825.588-1.413Q3.175 4 4 4h8v2H4v12h8v2Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Constellation sidebar (desktop) -->
      <aside id="jv-sidebar" class="jv-sidebar">
        <div class="jv-sidebar-header">
          <span class="jv-label-mono">Constellation</span>
          <button id="jv-home-btn" class="jv-chip-btn" type="button">HOME</button>
        </div>
        <div id="jv-rows" class="jv-rows"></div>
        <div class="jv-sidebar-footer">CLICK A ROW TO FLY THERE</div>
      </aside>

      <!-- Chat dock -->
      <div id="jv-dock" class="jv-dock">
        <div id="jv-transcript" class="jv-transcript"></div>
        <form id="message-form" class="jv-inputrow">
          <input
            id="message-input"
            type="text"
            placeholder="Ask JARVIS, or tap the core to speak"
            autocomplete="off"
          />
          <button id="attach-btn" class="jv-mic-btn" type="button" title="Allega immagine" style="border-radius:10px;">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6Z"/></svg>
          </button>
          <input id="image-input" type="file" accept="image/*" hidden />
          <button id="mic-btn" type="button" class="jv-mic-btn" title="Input vocale">
            <span class="jv-mic-dot"></span>
          </button>
          <button id="send-btn" type="submit" class="jv-send-btn" title="Invia">&#8594;</button>
        </form>
        <div id="image-preview" class="image-preview" hidden>
          <img id="image-preview-img" src="" alt="Immagine allegata" />
          <button id="image-preview-remove" type="button" aria-label="Rimuovi immagine">&times;</button>
        </div>
        <div class="jv-caption">
          <span id="jv-caption">Standby</span>
          <span class="jv-caption-sep">/</span>
          <span id="jv-subcaption">tap the core or type</span>
        </div>
      </div>

      <!-- Pannello di dettaglio -->
      <aside id="jv-panel" class="jv-panel" hidden>
        <div class="jv-panel-top">
          <span id="jv-panel-kind" class="jv-label-mono"></span>
          <button id="jv-panel-close" class="jv-chip-btn" type="button">ESC</button>
        </div>
        <div id="jv-panel-title" class="jv-panel-title"></div>
        <div id="jv-panel-summary" class="jv-panel-summary"></div>
        <div class="jv-panel-grid">
          <div>
            <div class="jv-panel-gridlabel">LAST ACTIVE</div>
            <div id="jv-panel-when" class="jv-panel-gridvalue"></div>
          </div>
          <div>
            <div class="jv-panel-gridlabel">EXCHANGES</div>
            <div id="jv-panel-msgs" class="jv-panel-gridvalue"></div>
          </div>
        </div>
        <div class="jv-panel-gridlabel" style="margin-bottom:7px;">LUMINOSITY / RELEVANCE</div>
        <div class="jv-panel-relbar"><div id="jv-panel-relfill" class="jv-panel-relfill"></div></div>
        <div class="jv-panel-gridlabel" style="margin-bottom:7px;">PROGETTO</div>
        <select id="jv-panel-project" class="jv-panel-project-select">
          <option value="">Nessuno</option>
        </select>
        <div class="jv-panel-footer">
          <span id="jv-panel-brain-dot" class="jv-dot"></span>
          <span id="jv-panel-brain" class="jv-panel-brain"></span>
        </div>
      </aside>

      <!-- Sezione Progetti: raggruppare conversazioni correlate -->
      <div id="projects-overlay" class="jv-modal-overlay" hidden>
        <div class="jv-modal">
          <div class="jv-panel-top">
            <span class="jv-label-mono">Progetti</span>
            <button id="projects-close-btn" class="jv-chip-btn" type="button">ESC</button>
          </div>
          <form id="project-create-form" class="jv-project-create">
            <input id="project-name-input" type="text" placeholder="Nome nuovo progetto" autocomplete="off" />
            <button type="submit" class="jv-action-btn primary">Crea</button>
          </form>
          <div id="projects-list" class="jv-library-list"></div>
        </div>
      </div>

      <!-- Sezione Siti Web: link salvati dall'utente -->
      <div id="sites-overlay" class="jv-modal-overlay" hidden>
        <div class="jv-modal">
          <div class="jv-panel-top">
            <span class="jv-label-mono">Siti Web</span>
            <button id="sites-close-btn" class="jv-chip-btn" type="button">ESC</button>
          </div>
          <form id="site-create-form" class="jv-project-create">
            <input id="site-url-input" type="url" placeholder="https://..." autocomplete="off" />
            <input id="site-title-input" type="text" placeholder="Titolo (opzionale)" autocomplete="off" />
            <button type="submit" class="jv-action-btn primary">Salva</button>
          </form>
          <div id="sites-list" class="jv-library-list"></div>
        </div>
      </div>

      <!-- Sezione Libreria: fatti di memoria a lungo termine (RF-013),
           prima invisibili all'utente -->
      <div id="library-overlay" class="jv-modal-overlay" hidden>
        <div class="jv-modal">
          <div class="jv-panel-top">
            <span class="jv-label-mono">Libreria</span>
            <button id="library-close-btn" class="jv-chip-btn" type="button">ESC</button>
          </div>
          <p class="jv-modal-desc">Fatti che JARVIS ricorda di te nel tempo.</p>
          <div id="library-list" class="jv-library-list"></div>
        </div>
      </div>

    </section>

  </div>

  <script src="js/vendor/socket.io.min.js" defer></script>
  <script type="module" src="js/scene.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
